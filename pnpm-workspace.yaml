# Expose Astro's image service dependency without hoisting every transitive package.
publicHoistPattern:
  - sharp

allowBuilds:
  esbuild: true
  sharp: true

# pnpm 11 default, set explicitly: refuse packages published less than a day ago
minimumReleaseAge: 1440

# Remove after 2026-10-05 02:56 UTC, when this security fix is 24 hours old.
minimumReleaseAgeExclude:
  - http-cache-semantics@4.3.0
